name: Project Backup

# Runs daily at 03:00 UTC. Can also be triggered manually from the Actions tab.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    name: Daily Backup — DB + Storage
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # AWS CLI picks these up automatically — no config file needed.
      AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION:    auto
      R2_ENDPOINT:           https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      APP_BUCKET:            ${{ secrets.R2_APP_BUCKET_NAME }}
      BACKUP_BUCKET:         ${{ secrets.R2_BACKUP_BUCKET_NAME }}

    steps:
      # ── Timestamp & tier classification ───────────────────────────────────────
      - name: Generate backup timestamp and classify tier
        id: ts
        run: |
          TS=$(date -u '+%Y-%m-%d-%H-%M')
          DAY_OF_WEEK=$(date -u '+%u')    # 1=Mon … 7=Sun
          DAY_OF_MONTH=$(date -u '+%d')   # 01-31
          echo "TS=$TS"                   >> "$GITHUB_OUTPUT"
          echo "DAY_OF_WEEK=$DAY_OF_WEEK" >> "$GITHUB_OUTPUT"
          echo "DAY_OF_MONTH=$DAY_OF_MONTH" >> "$GITHUB_OUTPUT"
          echo "Backup run: $TS UTC (weekday=$DAY_OF_WEEK, day-of-month=$DAY_OF_MONTH)"

      # ── PostgreSQL client ──────────────────────────────────────────────────────
      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update -qq
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16

      # ── Database backup ────────────────────────────────────────────────────────
      - name: Dump PostgreSQL database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          DB_FILE="db-backup-${{ steps.ts.outputs.TS }}.sql.gz"
          pg_dump --dbname="$DATABASE_URL" --no-password | gzip > "$DB_FILE"
          echo "DB_FILE=$DB_FILE" >> "$GITHUB_ENV"
          echo "Database dump complete. Size: $(du -sh "$DB_FILE" | cut -f1)"

      # ── Storage backup ─────────────────────────────────────────────────────────
      - name: Sync app storage bucket to local directory
        run: |
          mkdir -p storage-backup
          aws s3 sync "s3://$APP_BUCKET/" ./storage-backup/ \
            --endpoint-url "$R2_ENDPOINT" \
            --no-progress
          echo "Files synced: $(find storage-backup -type f | wc -l)"

      - name: Create storage zip archive
        run: |
          STORAGE_FILE="storage-backup-${{ steps.ts.outputs.TS }}.zip"
          zip -r "$STORAGE_FILE" storage-backup/
          echo "STORAGE_FILE=$STORAGE_FILE" >> "$GITHUB_ENV"
          echo "Storage archive complete. Size: $(du -sh "$STORAGE_FILE" | cut -f1)"

      # ── Upload to daily prefix ─────────────────────────────────────────────────
      - name: Upload database backup (daily)
        run: |
          aws s3 cp "$DB_FILE" \
            "s3://$BACKUP_BUCKET/backups/daily/db/$DB_FILE" \
            --endpoint-url "$R2_ENDPOINT"
          echo "Uploaded → backups/daily/db/$DB_FILE"

      - name: Upload storage backup (daily)
        run: |
          aws s3 cp "$STORAGE_FILE" \
            "s3://$BACKUP_BUCKET/backups/daily/storage/$STORAGE_FILE" \
            --endpoint-url "$R2_ENDPOINT"
          echo "Uploaded → backups/daily/storage/$STORAGE_FILE"

      # ── Weekly copy (every Sunday = day 7) ────────────────────────────────────
      - name: Upload weekly copy (Sundays only)
        if: steps.ts.outputs.DAY_OF_WEEK == '7'
        run: |
          aws s3 cp "$DB_FILE" \
            "s3://$BACKUP_BUCKET/backups/weekly/db/$DB_FILE" \
            --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "$STORAGE_FILE" \
            "s3://$BACKUP_BUCKET/backups/weekly/storage/$STORAGE_FILE" \
            --endpoint-url "$R2_ENDPOINT"
          echo "Weekly copies uploaded."

      # ── Monthly copy (1st of each month) ──────────────────────────────────────
      - name: Upload monthly copy (1st of month only)
        if: steps.ts.outputs.DAY_OF_MONTH == '01'
        run: |
          aws s3 cp "$DB_FILE" \
            "s3://$BACKUP_BUCKET/backups/monthly/db/$DB_FILE" \
            --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "$STORAGE_FILE" \
            "s3://$BACKUP_BUCKET/backups/monthly/storage/$STORAGE_FILE" \
            --endpoint-url "$R2_ENDPOINT"
          echo "Monthly copies uploaded."

      # ── Retention: daily — keep 7 most recent ─────────────────────────────────
      - name: Prune old daily database backups (keep 7)
        run: |
          OLD=$(aws s3 ls "s3://$BACKUP_BUCKET/backups/daily/db/" \
            --endpoint-url "$R2_ENDPOINT" \
            | sort -r | tail -n +8 | awk '{print $4}')
          if [ -z "$OLD" ]; then
            echo "Nothing to prune (daily DB)."
          else
            for f in $OLD; do
              aws s3 rm "s3://$BACKUP_BUCKET/backups/daily/db/$f" \
                --endpoint-url "$R2_ENDPOINT"
              echo "Deleted: $f"
            done
          fi

      - name: Prune old daily storage backups (keep 7)
        run: |
          OLD=$(aws s3 ls "s3://$BACKUP_BUCKET/backups/daily/storage/" \
            --endpoint-url "$R2_ENDPOINT" \
            | sort -r | tail -n +8 | awk '{print $4}')
          if [ -z "$OLD" ]; then
            echo "Nothing to prune (daily storage)."
          else
            for f in $OLD; do
              aws s3 rm "s3://$BACKUP_BUCKET/backups/daily/storage/$f" \
                --endpoint-url "$R2_ENDPOINT"
              echo "Deleted: $f"
            done
          fi

      # ── Retention: weekly — keep 5 most recent ────────────────────────────────
      - name: Prune old weekly database backups (keep 5)
        if: steps.ts.outputs.DAY_OF_WEEK == '7'
        run: |
          OLD=$(aws s3 ls "s3://$BACKUP_BUCKET/backups/weekly/db/" \
            --endpoint-url "$R2_ENDPOINT" \
            | sort -r | tail -n +6 | awk '{print $4}')
          if [ -z "$OLD" ]; then
            echo "Nothing to prune (weekly DB)."
          else
            for f in $OLD; do
              aws s3 rm "s3://$BACKUP_BUCKET/backups/weekly/db/$f" \
                --endpoint-url "$R2_ENDPOINT"
              echo "Deleted: $f"
            done
          fi

      - name: Prune old weekly storage backups (keep 5)
        if: steps.ts.outputs.DAY_OF_WEEK == '7'
        run: |
          OLD=$(aws s3 ls "s3://$BACKUP_BUCKET/backups/weekly/storage/" \
            --endpoint-url "$R2_ENDPOINT" \
            | sort -r | tail -n +6 | awk '{print $4}')
          if [ -z "$OLD" ]; then
            echo "Nothing to prune (weekly storage)."
          else
            for f in $OLD; do
              aws s3 rm "s3://$BACKUP_BUCKET/backups/weekly/storage/$f" \
                --endpoint-url "$R2_ENDPOINT"
              echo "Deleted: $f"
            done
          fi

      # ── Retention: monthly — keep 12 most recent ──────────────────────────────
      - name: Prune old monthly database backups (keep 12)
        if: steps.ts.outputs.DAY_OF_MONTH == '01'
        run: |
          OLD=$(aws s3 ls "s3://$BACKUP_BUCKET/backups/monthly/db/" \
            --endpoint-url "$R2_ENDPOINT" \
            | sort -r | tail -n +13 | awk '{print $4}')
          if [ -z "$OLD" ]; then
            echo "Nothing to prune (monthly DB)."
          else
            for f in $OLD; do
              aws s3 rm "s3://$BACKUP_BUCKET/backups/monthly/db/$f" \
                --endpoint-url "$R2_ENDPOINT"
              echo "Deleted: $f"
            done
          fi

      - name: Prune old monthly storage backups (keep 12)
        if: steps.ts.outputs.DAY_OF_MONTH == '01'
        run: |
          OLD=$(aws s3 ls "s3://$BACKUP_BUCKET/backups/monthly/storage/" \
            --endpoint-url "$R2_ENDPOINT" \
            | sort -r | tail -n +13 | awk '{print $4}')
          if [ -z "$OLD" ]; then
            echo "Nothing to prune (monthly storage)."
          else
            for f in $OLD; do
              aws s3 rm "s3://$BACKUP_BUCKET/backups/monthly/storage/$f" \
                --endpoint-url "$R2_ENDPOINT"
              echo "Deleted: $f"
            done
          fi

      # ── Summary ───────────────────────────────────────────────────────────────
      - name: Backup summary
        run: |
          echo "========================================"
          echo "Backup completed at $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
          echo "  Database : backups/daily/db/$DB_FILE"
          echo "  Storage  : backups/daily/storage/$STORAGE_FILE"
          echo "  Bucket   : $BACKUP_BUCKET"
          echo "  Tiers    : daily (7) | weekly on Sun (5) | monthly on 1st (12)"
          echo "========================================"
